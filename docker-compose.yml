# AI Knowledge API - docker-compose up -d
# API: http://localhost:8000/docs

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/knowledge_db
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      JWT_SECRET_KEY: dev-secret-change-in-production-32chars
      JWT_REFRESH_SECRET_KEY: dev-refresh-secret-change-prod-32chars
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis
      - chromadb
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery:
    build: .
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/knowledge_db
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis
      - chromadb
    command: celery -A app.tasks:celery_app worker --loglevel=info

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: knowledge_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  pgdata:
  chroma_data:
  uploads_data:
